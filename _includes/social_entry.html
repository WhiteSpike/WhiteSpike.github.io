<a class="social mx-1" href="{{ include.service_url }}{{ include.account }}"
    style="color:'#{{ include.unfocused_color }};font-size: {{ include.font_size}};'"
    onMouseOver="this.style.color='#{{ include.focused_color }}'"
    OnMouseOut="this.style.color='#{{ include.unfocused_color }}'">
    <icon class="{{ include.icon }} fa-1x"></icon>
</a>
