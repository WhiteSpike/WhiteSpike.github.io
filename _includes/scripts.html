
<script>   
   //Button for the scroll Down
  document.querySelector('.scroll-down-btn').addEventListener('click', function() {
      window.scrollBy({
          top: window.innerHeight - 50, // Scroll down one full window height
          behavior: 'smooth' // Smooth scroll
      });
  });
  // Event listener for hiding the button on scroll
  window.addEventListener('scroll', function() {
    var scrollPos = window.scrollY || window.pageYOffset; // Current scroll position
    var button = document.querySelector('.scroll-down-btn');
    
    if (scrollPos > 100) { // If the user scrolls down more than 100 pixels
        button.style.display = 'none'; // Hide the scroll button
    } else {
        button.style.display = 'flex'; // Otherwise, show it
    }
  });

</script>
